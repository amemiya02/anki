// Hayaki additions. The file name sorts after every upstream proto file, so
// upstream's service and method numbers do not move.

syntax = "proto3";

option java_multiple_files = true;

// The package matches the file name, as Anki's TypeScript and Python
// generators derive import paths from it.
package anki.zz_hayaki;

import "anki/generic.proto";

service HayakiService {}

service BackendHayakiService {
  // RWKV scheduling (Hayaki ADR-0009): whether the switch is on and whether
  // the model is ready.
  rpc RwkvStatus(generic.Empty) returns (RwkvStatusResponse);
  // Downloads the model weights into weights_dir if they are missing, loads
  // them, and starts preparing the open collection in the background.
  // Returns once preparation has started; poll RwkvStatus for progress.
  rpc PrepareRwkv(PrepareRwkvRequest) returns (RwkvStatusResponse);
  // Chooses the model. The choice syncs with the collection. With the switch
  // on, call PrepareRwkv next.
  rpc SetRwkvModel(SetRwkvModelRequest) returns (RwkvStatusResponse);
}

message PrepareRwkvRequest {
  string weights_dir = 1;
}

enum RwkvModel {
  RWKV_MODEL_SMALL = 0;
  RWKV_MODEL_BIG = 1;
  RWKV_MODEL_TINY = 2;
}

message SetRwkvModelRequest {
  RwkvModel model = 1;
}

// The weights file of a model, for apps that download it themselves.
message RwkvWeights {
  string file_name = 1;
  string url = 2;
  string sha256 = 3;
  uint64 size = 4;
}

message RwkvStatusResponse {
  enum State {
    NOT_PREPARED = 0;
    PREPARING = 1;
    READY = 2;
    FAILED = 3;
  }
  bool enabled = 1;
  State state = 2;
  uint64 done = 3;
  uint64 total = 4;
  string error = 5;
  // The chosen model; state and progress are that model's.
  RwkvModel model = 6;
  RwkvWeights weights = 7;
}
